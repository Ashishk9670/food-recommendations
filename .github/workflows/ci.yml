name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 12:00 PM IST daily (IST is UTC+5:30, so 06:30 UTC)
  schedule:
    - cron: "30 6 * * *"

jobs:
  static-checks:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SITE_URL: ${{ secrets.SITE_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        id: tests
        run: npm run test:e2e
      - name: Write job summary
        # Runs regardless of pass/fail, so the run's summary page always shows
        # today's result at a glance — no click-through or download needed.
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "### ✅ Playwright E2E — all tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Playwright E2E — failures (see the annotations above and the playwright-report artifact for full detail)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        # Always upload (not just on failure) so the daily scheduled run has
        # something to download even when everything passes — GitHub Pages
        # would give a one-click view instead, but that needs a paid plan
        # for a private repo, so this is the free alternative: one click to
        # download the html report zip, unrelated to whether it's a pass.
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
